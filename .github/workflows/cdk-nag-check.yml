name: cdk-nag-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mínimo privilegio: el job solo necesita leer el repositorio.
permissions:
  contents: read

# Cancela ejecuciones anteriores del mismo branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Typecheck, tests y cdk-nag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions fijadas por SHA de commit (no por tag mutable); Dependabot las actualiza.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run build

      # Incluye validateScope() de cdk-nag sobre ambos stacks, más un umbral
      # de cobertura del 100% (jest.config.js).
      - name: Tests (incluye cdk-nag)
        run: npm test -- --coverage

      # El paso que bloquea el merge: si cdk-nag reporta un error en
      # SecureStack, `cdk synth` sale con código distinto de cero.
      # No necesita credenciales de AWS ni Docker.
      - name: cdk synth (SecureStack)
        run: npx cdk synth --quiet

      # Prueba que el stack "antes" SIGUE fallando: si un día pasara, el
      # tutorial estaría mostrando fallas que cdk-nag ya no detecta.
      - name: cdk synth (InsecureStack debe fallar)
        run: |
          if npx cdk synth InsecureStack -c includeInsecure=true --quiet; then
            echo "::error::InsecureStack pasó cdk-nag, pero debería fallar."
            exit 1
          fi
