version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release: a buffer against freshly
    # published malicious versions.
    cooldown:
      default-days: 7
    groups:
      aws-cdk:
        patterns: ['aws-cdk', 'aws-cdk-lib', 'constructs', 'cdk-nag']
      dev-dependencies:
        dependency-type: development
        exclude-patterns: ['aws-cdk']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
